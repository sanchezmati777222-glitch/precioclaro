
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PrecioClaro | Calculá tu precio</title>
   
<style>
  :root {
    --fondo: #f3f6fb;
    --tarjeta: #ffffff;
    --texto: #172033;
    --secundario: #64748b;
    --borde: #e2e8f0;
    --verde: #10b981;
    --verde-oscuro: #047857;
    --azul: #2563eb;
  }

  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    min-height: 100vh;
    font-family: Inter, system-ui, -apple-system, sans-serif;
    background:
      radial-gradient(ellipse at top, #e0f2fe 0%, transparent 48%),
      var(--fondo);
    color: var(--texto);
    line-height: 1.6;
  }

  main {
    width: min(92%, 560px);
    margin: 0 auto;
    padding: 38px 0;
  }

  header {
    text-align: center;
    margin-bottom: 28px;
  }

  header h1 {
    font-size: clamp(30px, 6vw, 42px);
    letter-spacing: -1.5px;
    margin: 0 0 8px;
    font-weight: 800;
  }

  header h1::first-letter {
    color: var(--verde-oscuro);
  }

  h2 {
    font-size: 22px;
    letter-spacing: -0.5px;
    margin: 0 0 22px;
  }

  .muted {
    color: var(--secundario);
    line-height: 1.7;
  }

  header .muted {
    max-width: 390px;
    margin: 0 auto;
  }

  .panel {
    background: var(--tarjeta);
    border: 1px solid rgba(226, 232, 240, 0.9);
    border-radius: 22px;
    padding: clamp(22px, 5vw, 32px);
    box-shadow: 0 20px 60px rgba(15, 23, 42, 0.08);
  }

  label {
    display: block;
    font-weight: 650;
    font-size: 14px;
    margin: 19px 0 8px;
  }

  input {
    display: block;
    width: 100%;
    min-height: 49px;
    padding: 13px 14px;
    border: 1px solid #dbe3ed;
    border-radius: 11px;
    background: #f8fafc;
    color: var(--texto);
    font: inherit;
    font-size: 16px;
    transition: border-color 0.2s, box-shadow 0.2s;
  }

  input:focus {
    outline: none;
    border-color: var(--azul);
    box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.13);
    background: white;
  }

  button {
    width: 100%;
    min-height: 51px;
    margin-top: 25px;
    padding: 14px 18px;
    border: none;
    border-radius: 12px;
    background: var(--verde);
    color: #052e24;
    font: inherit;
    font-size: 16px;
    font-weight: 750;
    cursor: pointer;
    box-shadow: 0 5px 12px rgba(16, 185, 129, 0.18);
    transition: transform 0.2s, background 0.2s;
  }

  button:hover {
    background: #34d399;
    transform: translateY(-1px);
  }

  button:focus-visible {
    outline: 3px solid var(--azul);
    outline-offset: 3px;
  }

  #resultado {
    display: none;
    margin-top: 24px;
    padding: 22px;
    border: 1px solid #a7f3d0;
    border-radius: 16px;
    background: #ecfdf5;
    overflow-wrap: anywhere;
  }

  #resultado .muted {
    margin-top: 0;
  }

  .precio {
    color: var(--verde-oscuro);
    font-size: clamp(26px, 6vw, 34px);
    font-weight: 800;
    letter-spacing: -1px;
    line-height: 1.3;
    margin: 8px 0 14px;
  }

  #detalle {
    color: #334155;
    font-size: 14px;
    line-height: 1.7;
    margin-bottom: 0;
  }

  footer {
    margin: 22px auto 0;
    max-width: 450px;
    color: var(--secundario);
    font-size: 12px;
    line-height: 1.7;
    text-align: center;
  }

  @media (max-width: 480px) {
    main {
      width: min(92%, 560px);
      padding: 25px 0;
    }

    header {
      margin-bottom: 22px;
    }

    .panel {
      border-radius: 18px;
    }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      transition: none !important;
    }
  }
</style>
</head>
<body>
  <main>
    <header>
      <h1>PrecioClaro 💡</h1>
      <p class="muted">
        Calculá un precio de venta orientativo para tus productos.
        Simple, gratis y sin registrarte.
      </p>
    </header>

    <section class="panel">
      <h2>Calculadora de precios</h2>

      <label for="costo">Costo del producto (ARS)</label>
      <input id="costo" type="number" min="0"
        step="0.01" placeholder="Ej. 5000">

      <label for="extras">Otros costos por unidad (ARS)</label>
      <input id="extras" type="number" min="0"
        step="0.01" placeholder="Ej. 500">

      <label for="margen">Margen de ganancia deseado (%)</label>
<input id="margen" type="number" min="0"
  max="99" step="0.5" value="30">

<label for="comisionVenta">Comisión de venta (%)</label>
<input id="comisionVenta" type="number" min="0"
  max="99" step="0.5" value="0" placeholder="Ej. 10">

<label for="comisionPago">Comisión del medio de pago (%)</label>
<input id="comisionPago" type="number" min="0"
  max="99" step="0.5" value="0" placeholder="Ej. 5">

<label for="cargoFijo">Cargo fijo por venta (ARS)</label>
<input id="cargoFijo" type="number" min="0"
  step="0.01" value="0" placeholder="Ej. 200">

<button onclick="calcular()">Calcular precio</button>

      <div id="resultado" aria-live="polite">
        <p class="muted">Precio de venta sugerido</p>
        <div class="precio" id="precio"></div>
        <p id="detalle"></p>
      </div>
    </section>

    <footer>
      Estimación orientativa. No contempla automáticamente
      impuestos, comisiones ni costos que no hayas ingresado.
    </footer>
  </main>

  <script>
    function calcular() {
      const costo = Number(document.getElementById("costo").value);
      const extras = Number(document.getElementById("extras").value || 0);
      const margen = Number(document.getElementById("margen").value);
      const resultado = document.getElementById("resultado");

      if (
        document.getElementById("costo").value === "" ||
        costo <= 0 || extras < 0 ||
        margen < 0 || margen >= 100
      ) {
        alert("Ingresá un costo válido y un margen entre 0 y 99%.");
        return;
      }

      const total = costo + extras;
      const precio = total / (1 - margen / 100);
      const ganancia = precio - total;
      const formato = n => n.toLocaleString("es-AR", {
        style: "currency",
        currency: "ARS",
        maximumFractionDigits: 2
      });

      document.getElementById("precio").textContent =
        formato(precio);

      document.getElementById("detalle").textContent =
        "Costos ingresados: " + formato(total) +
        ". Ganancia estimada: " + formato(ganancia) +
        ". Revisá también impuestos y comisiones.";

      resultado.style.display = "block";
    }
  </script>
</body>
</html>
